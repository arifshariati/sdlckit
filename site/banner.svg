<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc">
  <title id="title">sdlckit: Claude Code, engineered</title>
  <desc id="desc">An opinionated software delivery workflow for Claude Code, with an AI delivery team that turns feature requests into reviewed pull requests. Three gates: intake, plan, acceptance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" rx="3" fill="url(#accent)"/>

  <!-- Left: name and tagline -->
  <text x="72" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="#f8fafc" letter-spacing="-2">sdlckit</text>
  <text x="74" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#cbd5e1">Claude Code, engineered.</text>
  <text x="74" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#94a3b8">A workflow and an AI delivery team that turn a feature into a reviewed PR.</text>

  <!-- Right: the three gates -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600">
    <rect x="800" y="62" width="330" height="54" rx="27" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
    <text x="965" y="97" text-anchor="middle" fill="#fdba74">1 · Intake gate</text>

    <line x1="965" y1="116" x2="965" y2="134" stroke="#64748b" stroke-width="2"/>
    <rect x="800" y="134" width="330" height="54" rx="27" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="965" y="169" text-anchor="middle" fill="#d8b4fe">2 · Plan gate</text>

    <line x1="965" y1="188" x2="965" y2="206" stroke="#64748b" stroke-width="2"/>
    <rect x="800" y="206" width="330" height="54" rx="27" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <text x="965" y="241" text-anchor="middle" fill="#86efac">3 · Acceptance gate</text>
  </g>
</svg>
