name: Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Run quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up sdlckit
        uses: ./.github/actions/setup

      # The gate runner and the content tools run from dist/, which is not committed, so build first.
      - name: Build
        shell: bash
        run: pnpm build

      - name: Run gates
        shell: bash
        env:
          SDLCKIT_CLAUDE_BIN: claude
        run: pnpm gates
